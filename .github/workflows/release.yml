name: Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.semver.outputs.VERSION }}
      tag: ${{ steps.semver.outputs.TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Printman.slnx

      - name: Test with coverage
        run: dotnet test Printman.slnx --configuration Release --no-restore --coverage --coverage-output-format cobertura --coverage-settings coverage.runsettings

      - name: Enforce coverage ratchet
        shell: pwsh
        run: ./eng/check-coverage.ps1

      - name: Determine Semantic Version
        id: semver
        shell: pwsh
        run: |
          git fetch --tags --force
          $headTag = git tag --points-at HEAD "v*.*.*" | Select-Object -First 1
          if ($headTag) {
              $tag = $headTag
              $version = $tag.TrimStart('v')
              Write-Host "Reusing existing tag at HEAD: $tag"
          } else {
              $latestTag = git tag -l "v*.*.*" --sort=-v:refname | Select-Object -First 1
              if (-not $latestTag) {
                  $version = "1.0.0"
              } else {
                  $cleanTag = $latestTag.TrimStart('v')
                  $parts = $cleanTag.Split('.')
                  $major = [int]$parts[0]
                  $minor = [int]$parts[1]
                  $patch = [int]$parts[2]

                  $commits = git log "$latestTag..HEAD" --oneline
                  if ($commits -match "BREAKING CHANGE" -or $commits -match "^\w+!:") {
                      $major++
                      $minor = 0
                      $patch = 0
                  } elseif ($commits -match "feat(\(.*\))?:") {
                      $minor++
                      $patch = 0
                  } else {
                      $patch++
                  }
                  $version = "$major.$minor.$patch"
              }
              $tag = "v$version"
          }

          Write-Host "Target Version: $version"
          Write-Host "Target Git Tag: $tag"
          "VERSION=$version" >> $env:GITHUB_OUTPUT
          "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Extract Changelog
        id: changelog
        shell: pwsh
        run: |
          $ver = "${{ steps.semver.outputs.VERSION }}"
          $changelog = ""
          if (Test-Path "CHANGELOG.md") {
              $lines = Get-Content "CHANGELOG.md"
              $targetTag = "[$ver]"
              $capturing = $false
              $section = [System.Collections.Generic.List[string]]::new()

              foreach ($l in $lines) {
                  if ($l.Contains($targetTag)) {
                      $capturing = $true
                      continue
                  }
                  if ($capturing -and $l.StartsWith("## [")) {
                      break
                  }
                  if ($capturing) {
                      $section.Add($l)
                  }
              }

              if ($section.Count -eq 0) {
                  $capturing = $false
                  foreach ($l in $lines) {
                      if ($l.Contains("[Unreleased]")) {
                          $capturing = $true
                          continue
                      }
                      if ($capturing -and $l.StartsWith("## [")) {
                          break
                      }
                      if ($capturing) {
                          $section.Add($l)
                      }
                  }
              }
              $changelog = ($section -join "`n").Trim()
          }

          if (-not $changelog) {
              $changelog = "Maintenance release and operational updates."
          }

          # Write changelog to a temporary file to preserve multiline formatting cleanly
          $changelog | Out-File -FilePath "./release_changelog.md" -Encoding utf8
          Write-Host "Extracted Changelog:"
          Write-Host $changelog

      - name: Publish Standalone (Self-Contained Single File)
        shell: pwsh
        run: |
          $ver = "${{ steps.semver.outputs.VERSION }}"
          dotnet publish src/Printman/Printman.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:Version=$ver `
            -o ./dist/standalone

          Copy-Item -Path "README.md", "LICENSE" -Destination "./dist/standalone"
          Compress-Archive -Path "./dist/standalone/*" -DestinationPath "./printman-v$ver-win-x64.zip" -Force

      - name: Publish Portable (Framework-Dependent)
        shell: pwsh
        run: |
          $ver = "${{ steps.semver.outputs.VERSION }}"
          dotnet publish src/Printman/Printman.csproj -c Release -r win-x64 --self-contained false `
            -p:Version=$ver `
            -o ./dist/portable

          Copy-Item -Path "README.md", "LICENSE" -Destination "./dist/portable"
          Compress-Archive -Path "./dist/portable/*" -DestinationPath "./printman-v$ver-win-x64-framework-dependent.zip" -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.semver.outputs.TAG }}"
          $ver = "${{ steps.semver.outputs.VERSION }}"
          $changelogText = Get-Content "./release_changelog.md" -Raw

          $releaseNotes = @"
          ## Printman $tag

          ### What's Changed
          $changelogText

          ---

          ### Download Options
          - **``printman-v$ver-win-x64.zip``** ⭐ **Recommended (Standalone)**:
            Fully self-contained single executable. Includes the .NET runtime. Runs out of the box on Windows 10/11 with zero installation required.
          - **``printman-v$ver-win-x64-framework-dependent.zip``** (Lightweight):
            Smaller download for users and developers who already have the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download) installed.
          - **``printman-v$ver-linux-x64.tar.gz``**, **``linux-arm64``** (Raspberry Pi 3/4/5, 64-bit OS), **``linux-arm``** (Raspberry Pi 2/3/4, 32-bit OS):
            Self-contained single executable. Prints through CUPS (``sudo apt install cups``).
          - **``printman-v$ver-osx-arm64.tar.gz``** (Apple Silicon), **``osx-x64``** (Intel Mac):
            Self-contained single executable using the built-in macOS printing system (CUPS).
          "@

          gh release create $tag `
            "./printman-v$ver-win-x64.zip#printman-v$ver-win-x64.zip (Standalone - Recommended)" `
            "./printman-v$ver-win-x64-framework-dependent.zip#printman-v$ver-win-x64-framework-dependent.zip (Framework-Dependent)" `
            --title "Printman $tag" `
            --notes $releaseNotes `
            --generate-notes

  # Linux / macOS builds are attached to the release created above. macOS archives are built on macOS so the
  # SDK can ad-hoc sign the executable (Apple Silicon refuses to run unsigned binaries).
  unix:
    needs: release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rids: linux-x64 linux-arm64 linux-arm
          - os: macos-latest
            rids: osx-arm64 osx-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          for rid in ${{ matrix.rids }}; do
            out="./dist/$rid"
            dotnet publish src/Printman/Printman.csproj -c Release -r "$rid" --self-contained true \
              -p:PublishSingleFile=true -p:Version="$VERSION" -o "$out"
            rm -f "$out"/*.pdb
            chmod +x "$out/printman"
            cp README.md LICENSE "$out/"
            tar -czf "printman-v$VERSION-$rid.tar.gz" -C "$out" .
            gh release upload "$TAG" "printman-v$VERSION-$rid.tar.gz" --clobber
          done
