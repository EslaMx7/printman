name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit semantic version (e.g. 2.0.0). Leave blank to calculate automatically."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.semver.outputs.VERSION }}
      tag: ${{ steps.semver.outputs.TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Printman.slnx

      - name: Test with coverage
        run: dotnet test Printman.slnx --configuration Release --no-restore --coverage --coverage-output-format cobertura --coverage-settings coverage.runsettings

      - name: Enforce coverage ratchet
        shell: pwsh
        run: ./eng/check-coverage.ps1

      - name: Determine Semantic Version
        id: semver
        shell: pwsh
        run: |
          $inputVersion = "${{ github.event.inputs.version }}".Trim()
          if ($inputVersion) {
              $cleanVersion = $inputVersion.TrimStart('v')
              $version = $cleanVersion
              $tag = "v$version"
              Write-Host "Using workflow_dispatch explicit version: $version ($tag)"
          } else {
              git fetch --tags --force
              $headTag = git tag --points-at HEAD "v*.*.*" | Select-Object -First 1
              if ($headTag) {
                  $tag = $headTag
                  $version = $tag.TrimStart('v')
                  Write-Host "Reusing existing tag at HEAD: $tag"
              } else {
                  $latestTag = git tag -l "v*.*.*" --sort=-v:refname | Select-Object -First 1
                  if (-not $latestTag) {
                      $version = "1.0.0"
                  } else {
                      $cleanTag = $latestTag.TrimStart('v')
                      $parts = $cleanTag.Split('.')
                      $major = [int]$parts[0]
                      $minor = [int]$parts[1]
                      $patch = [int]$parts[2]

                      $commits = git log "$latestTag..HEAD" --oneline
                      if ($commits -match "BREAKING CHANGE" -or $commits -match "\b\w+(\(.*\))?!:") {
                          $major++
                          $minor = 0
                          $patch = 0
                      } elseif ($commits -match "feat(\(.*\))?:") {
                          $minor++
                          $patch = 0
                      } else {
                          $patch++
                      }
                      $version = "$major.$minor.$patch"
                  }
                  $tag = "v$version"
              }
          }

          Write-Host "Target Version: $version"
          Write-Host "Target Git Tag: $tag"
          "VERSION=$version" >> $env:GITHUB_OUTPUT
          "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Extract Changelog
        id: changelog
        shell: pwsh
        run: |
          $ver = "${{ steps.semver.outputs.VERSION }}"
          $changelog = ""
          if (Test-Path "CHANGELOG.md") {
              $lines = Get-Content "CHANGELOG.md"
              $targetTag = "[$ver]"
              $capturing = $false
              $section = [System.Collections.Generic.List[string]]::new()

              foreach ($l in $lines) {
                  if ($l.Contains($targetTag)) {
                      $capturing = $true
                      continue
                  }
                  if ($capturing -and $l.StartsWith("## [")) {
                      break
                  }
                  if ($capturing) {
                      $section.Add($l)
                  }
              }

              if ($section.Count -eq 0) {
                  $capturing = $false
                  foreach ($l in $lines) {
                      if ($l.Contains("[Unreleased]")) {
                          $capturing = $true
                          continue
                      }
                      if ($capturing -and $l.StartsWith("## [")) {
                          break
                      }
                      if ($capturing) {
                          $section.Add($l)
                      }
                  }
              }
              $changelog = ($section -join "`n").Trim()
          }

          if (-not $changelog) {
              $changelog = "Maintenance release and operational updates."
          }

          # Write changelog to a temporary file to preserve multiline formatting cleanly
          $changelog | Out-File -FilePath "./release_changelog.md" -Encoding utf8
          Write-Host "Extracted Changelog:"
          Write-Host $changelog

      - name: Publish Standalone x64 (Self-Contained Single File)
        shell: pwsh
        run: |
          $ver = "${{ steps.semver.outputs.VERSION }}"
          dotnet publish src/Printman/Printman.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:Version=$ver `
            -o ./dist/standalone-x64

          # Direct standalone executable
          Copy-Item "./dist/standalone-x64/printman.exe" -Destination "./printman-v$ver-win-x64.exe"

          Copy-Item -Path "README.md", "LICENSE" -Destination "./dist/standalone-x64"
          Compress-Archive -Path "./dist/standalone-x64/*" -DestinationPath "./printman-v$ver-win-x64.zip" -Force

      - name: Publish Standalone ARM64 (Self-Contained Single File)
        shell: pwsh
        run: |
          $ver = "${{ steps.semver.outputs.VERSION }}"
          dotnet publish src/Printman/Printman.csproj -c Release -r win-arm64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:Version=$ver `
            -o ./dist/standalone-arm64

          # Direct standalone executable
          Copy-Item "./dist/standalone-arm64/printman.exe" -Destination "./printman-v$ver-win-arm64.exe"

          Copy-Item -Path "README.md", "LICENSE" -Destination "./dist/standalone-arm64"
          Compress-Archive -Path "./dist/standalone-arm64/*" -DestinationPath "./printman-v$ver-win-arm64.zip" -Force

      - name: Publish Portable (Framework-Dependent)
        shell: pwsh
        run: |
          $ver = "${{ steps.semver.outputs.VERSION }}"
          dotnet publish src/Printman/Printman.csproj -c Release -r win-x64 --self-contained false `
            -p:Version=$ver `
            -o ./dist/portable

          Copy-Item -Path "README.md", "LICENSE" -Destination "./dist/portable"
          Compress-Archive -Path "./dist/portable/*" -DestinationPath "./printman-v$ver-win-x64-framework-dependent.zip" -Force

      - name: Create or Update GitHub Release (Draft)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "${{ steps.semver.outputs.TAG }}"
          $ver = "${{ steps.semver.outputs.VERSION }}"
          $changelogText = Get-Content "./release_changelog.md" -Raw

          $releaseNotes = @"
          ## Printman $tag

          ### What's Changed
          $changelogText

          ---

          ### Download Options

          #### Direct Executables & Disk Images
          - **``printman-v$ver-win-x64.exe``** ⭐: Standalone 64-bit Windows executable (no extraction needed).
          - **``printman-v$ver-win-arm64.exe``**: Standalone ARM64 Windows executable (Snapdragon X Elite / Copilot+ PCs).
          - **``printman-v$ver-osx-arm64.dmg``** 🍏: Mountable Apple Silicon macOS disk image.
          - **``printman-v$ver-osx-x64.dmg``**: Mountable Intel macOS disk image.
          - **``printman-v$ver-linux-x64``** 🐧: Standalone Linux x86_64 binary.
          - **``printman-v$ver-linux-arm64``** (Raspberry Pi 64-bit) / **``linux-arm``** (Raspberry Pi 32-bit): Standalone ARM Linux binary.
          - **``printman-v$ver-osx-arm64``** / **``osx-x64``**: Standalone macOS binary.

          #### Standalone Compressed Archives (ZIP / tar.gz)
          - Windows: **``printman-v$ver-win-x64.zip``**, **``printman-v$ver-win-arm64.zip``**
          - Linux / Raspberry Pi: **``printman-v$ver-linux-x64.tar.gz``**, **``linux-arm64.tar.gz``**, **``linux-arm.tar.gz``**
          - macOS: **``printman-v$ver-osx-arm64.tar.gz``**, **``osx-x64.tar.gz``**

          #### Portable (Framework-Dependent)
          - Windows: **``printman-v$ver-win-x64-framework-dependent.zip``** (requires [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download))

          #### Verification
          - **``checksums.txt``**: SHA-256 hashes of all release packages and binaries.
          "@

          $releaseExists = $false
          try {
              gh release view $tag > $null 2>&1
              if ($LASTEXITCODE -eq 0) {
                  $releaseExists = $true
              }
          } catch {
              $releaseExists = $false
          }

          if ($releaseExists) {
              Write-Host "Release $tag already exists. Updating notes and uploading Windows assets with --clobber..."
              gh release edit $tag --title "Printman $tag" --notes $releaseNotes
              gh release upload $tag `
                "./printman-v$ver-win-x64.exe#printman-v$ver-win-x64.exe (Standalone Executable)" `
                "./printman-v$ver-win-arm64.exe#printman-v$ver-win-arm64.exe (Standalone ARM64 Executable)" `
                "./printman-v$ver-win-x64.zip#printman-v$ver-win-x64.zip (Standalone x64 ZIP - Recommended)" `
                "./printman-v$ver-win-arm64.zip#printman-v$ver-win-arm64.zip (Standalone ARM64 ZIP)" `
                "./printman-v$ver-win-x64-framework-dependent.zip#printman-v$ver-win-x64-framework-dependent.zip (Framework-Dependent)" `
                --clobber
          } else {
              Write-Host "Creating draft release $tag..."
              gh release create $tag `
                "./printman-v$ver-win-x64.exe#printman-v$ver-win-x64.exe (Standalone Executable)" `
                "./printman-v$ver-win-arm64.exe#printman-v$ver-win-arm64.exe (Standalone ARM64 Executable)" `
                "./printman-v$ver-win-x64.zip#printman-v$ver-win-x64.zip (Standalone x64 ZIP - Recommended)" `
                "./printman-v$ver-win-arm64.zip#printman-v$ver-win-arm64.zip (Standalone ARM64 ZIP)" `
                "./printman-v$ver-win-x64-framework-dependent.zip#printman-v$ver-win-x64-framework-dependent.zip (Framework-Dependent)" `
                --title "Printman $tag" `
                --notes $releaseNotes `
                --draft
          }

  # Linux / macOS builds are attached to the draft release created above. macOS archives are built on macOS so the
  # SDK can ad-hoc sign the executable (Apple Silicon refuses to run unsigned binaries).
  unix:
    needs: release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rids: linux-x64 linux-arm64 linux-arm
            is_mac: false
          - os: macos-latest
            rids: osx-arm64 osx-x64
            is_mac: true
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          for rid in ${{ matrix.rids }}; do
            out="./dist/$rid"
            dotnet publish src/Printman/Printman.csproj -c Release -r "$rid" --self-contained true \
              -p:PublishSingleFile=true -p:Version="$VERSION" -o "$out"
            rm -f "$out"/*.pdb
            chmod +x "$out/printman"

            # 1. Direct standalone binary
            cp "$out/printman" "printman-v$VERSION-$rid"
            gh release upload "$TAG" "printman-v$VERSION-$rid" --clobber

            # 2. If macOS, also build mountable .dmg
            if [ "${{ matrix.is_mac }}" = "true" ]; then
              dmg_dir="./dmg_$rid"
              mkdir -p "$dmg_dir"
              cp "$out/printman" README.md LICENSE "$dmg_dir/"
              hdiutil create -volname "Printman" -srcfolder "$dmg_dir" -ov -format UDZO "printman-v$VERSION-$rid.dmg"
              gh release upload "$TAG" "printman-v$VERSION-$rid.dmg" --clobber
              rm -rf "$dmg_dir"
            fi

            # 3. Compressed archive
            cp README.md LICENSE "$out/"
            tar -czf "printman-v$VERSION-$rid.tar.gz" -C "$out" .
            gh release upload "$TAG" "printman-v$VERSION-$rid.tar.gz" --clobber
          done

  publish:
    needs: [release, unix]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release assets, generate checksums and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          mkdir -p ./release_assets
          cd ./release_assets
          gh release download "$TAG" --pattern "*"
          rm -f checksums.txt
          sha256sum printman-* > checksums.txt
          cat checksums.txt
          gh release upload "$TAG" checksums.txt --clobber
          gh release edit "$TAG" --draft=false
