name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit semantic version (e.g. 2.0.0). Leave blank to calculate automatically."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.semver.outputs.VERSION }}
      tag: ${{ steps.semver.outputs.TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Printman.slnx

      - name: Test with coverage
        run: dotnet test Printman.slnx --configuration Release --no-restore --coverage --coverage-output-format cobertura --coverage-settings coverage.runsettings

      - name: Enforce coverage ratchet
        shell: pwsh
        run: ./eng/check-coverage.ps1

      - name: Determine Semantic Version
        id: semver
        shell: pwsh
        run: |
          $inputVersion = "${{ github.event.inputs.version }}".Trim()
          if ($inputVersion) {
              $cleanVersion = $inputVersion.TrimStart('v')
              $version = $cleanVersion
              $tag = "v$version"
              Write-Host "Using workflow_dispatch explicit version: $version ($tag)"
          } else {
              git fetch --tags --force
              $headTag = git tag --points-at HEAD "v*.*.*" | Select-Object -First 1
              if ($headTag) {
                  $tag = $headTag
                  $version = $tag.TrimStart('v')
                  Write-Host "Reusing existing tag at HEAD: $tag"
              } else {
                  $latestTag = git tag -l "v*.*.*" --sort=-v:refname | Select-Object -First 1
                  if (-not $latestTag) {
                      $version = "1.0.0"
                  } else {
                      $cleanTag = $latestTag.TrimStart('v')
                      $parts = $cleanTag.Split('.')
                      $major = [int]$parts[0]
                      $minor = [int]$parts[1]
                      $patch = [int]$parts[2]

                      $commits = git log "$latestTag..HEAD" --oneline
                      if ($commits -match "BREAKING CHANGE" -or $commits -match "\b\w+(\(.*\))?!:") {
                          $major++
                          $minor = 0
                          $patch = 0
                      } elseif ($commits -match "feat(\(.*\))?:") {
                          $minor++
                          $patch = 0
                      } else {
                          $patch++
                      }
                      $version = "$major.$minor.$patch"
                  }
                  $tag = "v$version"
              }
          }

          Write-Host "Target Version: $version"
          Write-Host "Target Git Tag: $tag"
          "VERSION=$version" >> $env:GITHUB_OUTPUT
          "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Extract Changelog
        id: changelog
        shell: pwsh
        run: |
          $ver = "${{ steps.semver.outputs.VERSION }}"
          $changelog = ""
          if (Test-Path "CHANGELOG.md") {
              $lines = Get-Content "CHANGELOG.md"
              $targetTag = "[$ver]"
              $capturing = $false
              $section = [System.Collections.Generic.List[string]]::new()

              foreach ($l in $lines) {
                  if ($l.Contains($targetTag)) {
                      $capturing = $true
                      continue
                  }
                  if ($capturing -and $l.StartsWith("## [")) {
                      break
                  }
                  if ($capturing) {
                      $section.Add($l)
                  }
              }

              if ($section.Count -eq 0) {
                  $capturing = $false
                  foreach ($l in $lines) {
                      if ($l.Contains("[Unreleased]")) {
                          $capturing = $true
                          continue
                      }
                      if ($capturing -and $l.StartsWith("## [")) {
                          break
                      }
                      if ($capturing) {
                          $section.Add($l)
                      }
                  }
              }
              $changelog = ($section -join "`n").Trim()
          }

          if (-not $changelog) {
              $changelog = "Maintenance release and operational updates."
          }

          # Write changelog to a temporary file to preserve multiline formatting cleanly
          $changelog | Out-File -FilePath "./release_changelog.md" -Encoding utf8
          Write-Host "Extracted Changelog:"
          Write-Host $changelog

      - name: Publish Standalone x64 (Self-Contained Single File)
        shell: pwsh
        run: |
          $ver = "${{ steps.semver.outputs.VERSION }}"
          dotnet publish src/Printman/Printman.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:Version=$ver `
            -o ./dist/standalone-x64

          Copy-Item -Path "README.md", "LICENSE" -Destination "./dist/standalone-x64"
          Compress-Archive -Path "./dist/standalone-x64/*" -DestinationPath "./printman-v$ver-win-x64.zip" -Force

      - name: Publish Standalone ARM64 (Self-Contained Single File)
        shell: pwsh
        run: |
          $ver = "${{ steps.semver.outputs.VERSION }}"
          dotnet publish src/Printman/Printman.csproj -c Release -r win-arm64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:Version=$ver `
            -o ./dist/standalone-arm64

          Copy-Item -Path "README.md", "LICENSE" -Destination "./dist/standalone-arm64"
          Compress-Archive -Path "./dist/standalone-arm64/*" -DestinationPath "./printman-v$ver-win-arm64.zip" -Force

      - name: Publish Portable (Framework-Dependent)
        shell: pwsh
        run: |
          $ver = "${{ steps.semver.outputs.VERSION }}"
          dotnet publish src/Printman/Printman.csproj -c Release -r win-x64 --self-contained false `
            -p:Version=$ver `
            -o ./dist/portable

          Copy-Item -Path "README.md", "LICENSE" -Destination "./dist/portable"
          Compress-Archive -Path "./dist/portable/*" -DestinationPath "./printman-v$ver-win-x64-framework-dependent.zip" -Force

      - name: Create GitHub Release (Draft)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.semver.outputs.TAG }}"
          $ver = "${{ steps.semver.outputs.VERSION }}"
          $changelogText = Get-Content "./release_changelog.md" -Raw

          $releaseNotes = @"
          ## Printman $tag

          ### What's Changed
          $changelogText

          ---

          ### Download Options

          #### Windows 10 & 11
          - **``printman-v$ver-win-x64.zip``** ⭐ **Recommended (Standalone x64)**:
            Single self-contained executable. Runs out of the box on 64-bit Windows with zero dependencies.
          - **``printman-v$ver-win-arm64.zip``** (Standalone ARM64):
            Single self-contained executable for ARM64 Windows PCs (Snapdragon X Elite / Copilot+ PCs).
          - **``printman-v$ver-win-x64-framework-dependent.zip``** (Lightweight):
            Smaller download for users and developers who already have the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download) installed.

          #### Linux & Raspberry Pi
          - **``printman-v$ver-linux-x64.tar.gz``** (Linux x86_64):
            Single self-contained executable. Prints through CUPS (``sudo apt install cups``).
          - **``printman-v$ver-linux-arm64.tar.gz``** (Raspberry Pi 3/4/5, 64-bit OS):
            Single self-contained executable for 64-bit ARM Linux and Raspberry Pi OS.
          - **``printman-v$ver-linux-arm.tar.gz``** (Raspberry Pi 2/3/4, 32-bit OS):
            Single self-contained executable for 32-bit ARM Linux (ARMv7).

          #### macOS
          - **``printman-v$ver-osx-arm64.tar.gz``** (Apple Silicon):
            Single self-contained executable for M1/M2/M3/M4 Macs using the built-in macOS printing system (CUPS).
          - **``printman-v$ver-osx-x64.tar.gz``** (Intel Mac):
            Single self-contained executable for Intel-based Macs.

          #### Verification
          - **``checksums.txt``**: SHA-256 hashes of all release packages.
          "@

          gh release create $tag `
            "./printman-v$ver-win-x64.zip#printman-v$ver-win-x64.zip (Standalone x64 - Recommended)" `
            "./printman-v$ver-win-arm64.zip#printman-v$ver-win-arm64.zip (Standalone ARM64)" `
            "./printman-v$ver-win-x64-framework-dependent.zip#printman-v$ver-win-x64-framework-dependent.zip (Framework-Dependent)" `
            --title "Printman $tag" `
            --notes $releaseNotes `
            --draft

  # Linux / macOS builds are attached to the draft release created above. macOS archives are built on macOS so the
  # SDK can ad-hoc sign the executable (Apple Silicon refuses to run unsigned binaries).
  unix:
    needs: release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rids: linux-x64 linux-arm64 linux-arm
          - os: macos-latest
            rids: osx-arm64 osx-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          for rid in ${{ matrix.rids }}; do
            out="./dist/$rid"
            dotnet publish src/Printman/Printman.csproj -c Release -r "$rid" --self-contained true \
              -p:PublishSingleFile=true -p:Version="$VERSION" -o "$out"
            rm -f "$out"/*.pdb
            chmod +x "$out/printman"
            cp README.md LICENSE "$out/"
            tar -czf "printman-v$VERSION-$rid.tar.gz" -C "$out" .
            gh release upload "$TAG" "printman-v$VERSION-$rid.tar.gz" --clobber
          done

  publish:
    needs: [release, unix]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets, generate checksums and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          mkdir -p ./release_assets
          cd ./release_assets
          gh release download "$TAG" --pattern "*"
          sha256sum printman-* > checksums.txt
          cat checksums.txt
          gh release upload "$TAG" checksums.txt --clobber
          gh release edit "$TAG" --draft=false
