name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, release]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Printman.slnx

      - name: Build
        run: dotnet build Printman.slnx --no-restore --configuration Release

      - name: Test with coverage
        run: dotnet test Printman.slnx --no-build --configuration Release --coverage --coverage-output-format cobertura --coverage-settings coverage.runsettings

      - name: Enforce coverage ratchet
        id: coverage
        continue-on-error: true
        shell: pwsh
        run: ./eng/check-coverage.ps1

      # Sticky coverage report on the PR so pass/fail is visible without opening logs.
      - name: Comment coverage report
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- printman-coverage-report -->';
            const summaryPath = 'TestResults/coverage-summary.md';

            let body = marker + '\n';
            body += fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : '### Unit test coverage\n\nNo coverage report was produced.';

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                core.info(`Updated coverage comment #${existing.id}.`);
              } else {
                const created = await github.rest.issues.createComment({ owner, repo, issue_number, body });
                core.info(`Created coverage comment #${created.data.id}.`);
              }
            } catch (error) {
              // Fork PRs get a read-only token; don't fail the build over a missing comment.
              core.warning(`Could not post coverage comment: ${error.message}`);
            }

      - name: Fail when coverage is below the ratchet
        if: steps.coverage.outcome == 'failure'
        run: exit 1

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            TestResults/*.cobertura.xml
            TestResults/coverage-summary.md

      - name: Publish
        run: dotnet publish src/Printman/Printman.csproj --configuration Release -r win-x64 --self-contained false -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: ./publish

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build (Raspberry Pi / ARM)
        run: |
          dotnet build src/Printman/Printman.csproj --configuration Release -r linux-arm64
          dotnet build src/Printman/Printman.csproj --configuration Release -r linux-arm

      - name: Publish (x64)
        run: dotnet publish src/Printman/Printman.csproj --configuration Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Without CUPS, printman explains and exits 1
        run: |
          set +e
          out=$(./publish/printman list 2>&1); code=$?
          set -e
          echo "$out"
          test "$code" = "1"
          echo "$out" | grep -q "Cannot reach the CUPS print service"
          echo "$out" | grep -q "sudo apt install cups cups-filters"
          ./publish/printman --version   # help / version never need CUPS

      - name: Install CUPS with a virtual PDF printer and a stalled queue
        run: |
          sudo apt-get update
          sudo apt-get install -y cups cups-client cups-filters cups-pdf cups-ipp-utils poppler-utils avahi-daemon avahi-utils
          sudo systemctl start cups avahi-daemon
          sudo lpadmin -p PDF -E -v cups-pdf:/ -P /usr/share/ppd/cups-pdf/CUPS-PDF_opt.ppd
          # "Stalled": points at a port nobody listens on, so jobs stay queued for the queue / cancel / purge tests
          sudo lpadmin -p Stalled -E -v socket://127.0.0.1:9100 -m drv:///sample.drv/generic.ppd 2>&1 | grep -v deprecated || true
          lpstat -p

      - name: Smoke test, print (no paper)
        run: |
          ./publish/printman list
          ./publish/printman info PDF
          ./publish/printman tests/fixtures/test_sample.pdf -printer PDF -pages 1:2 -output out/test.pdf
          ./publish/printman tests/fixtures/sample.txt -printer PDF -output out/text.pdf
          test "$(pdfinfo out/test.pdf | awk '/^Pages:/ {print $2}')" = "2"
          ./publish/printman tests/fixtures/test_sample.pdf -printer PDF -pages 2
          for i in $(seq 1 20); do ls /home/runner/PDF/*.pdf 2>/dev/null && break; sleep 1; done
          ls /home/runner/PDF/*.pdf

      - name: Smoke test, queue / cancel / purge
        run: |
          ./publish/printman tests/fixtures/test_sample.pdf -printer Stalled
          ./publish/printman tests/fixtures/sample.txt -printer Stalled
          ./publish/printman queue Stalled | tee queue.txt
          grep -q "test_sample.pdf" queue.txt
          grep -q "sample.txt" queue.txt
          id=$(lpstat -o Stalled | head -1 | awk '{print $1}' | sed 's/.*-//')
          ./publish/printman cancel "$id"
          test "$(lpstat -o Stalled | wc -l)" = "1"
          ./publish/printman purge Stalled
          test "$(lpstat -o Stalled | wc -l)" = "0"

      - name: Smoke test, share (IPP + mDNS next to Avahi)
        run: |
          ./publish/printman share PDF --output-dir shared > share.log 2>&1 &
          for i in $(seq 1 30); do grep -q "Press Ctrl+C" share.log && break; sleep 1; done
          cat share.log
          ipptool -t ipp://localhost:8631/ipp/print/pdf get-printer-attributes.test
          ipptool -t -f tests/fixtures/test_sample.pdf ipp://localhost:8631/ipp/print/pdf print-job.test
          for i in $(seq 1 20); do ls shared/*.pdf 2>/dev/null && break; sleep 1; done
          test "$(pdfinfo shared/*.pdf | awk '/^Pages:/ {print $2}')" = "3"
          for i in $(seq 1 10); do avahi-browse -rpt _ipp._tcp | tee browse.txt | grep -q "Printman" && break; sleep 2; done
          grep "Printman" browse.txt | grep -q ":8631\|;8631;"
          kill %1; wait %1 || true

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: |
          dotnet build src/Printman/Printman.csproj --configuration Release -r osx-arm64
          dotnet build src/Printman/Printman.csproj --configuration Release -r osx-x64

      - name: Smoke test
        run: dotnet run --project src/Printman --configuration Release -r osx-arm64 -- list
