name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, release]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Printman.slnx

      - name: Build
        run: dotnet build Printman.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Printman.slnx --no-build --configuration Release

      - name: Publish
        run: dotnet publish src/Printman/Printman.csproj --configuration Release -r win-x64 --self-contained false -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: ./publish
