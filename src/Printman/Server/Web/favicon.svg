<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="pm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pm-paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Background App Squircle -->
  <rect width="32" height="32" rx="7" fill="url(#pm-bg)"/>
  
  <!-- Paper Feed In (Top) -->
  <rect x="9" y="4.5" width="14" height="8.5" rx="1.5" fill="url(#pm-paper)"/>
  <rect x="11.5" y="7" width="9" height="1" rx="0.5" fill="#cbd5e1"/>
  <rect x="11.5" y="9.2" width="6" height="1" rx="0.5" fill="#cbd5e1"/>

  <!-- Printer Main Body -->
  <rect x="5" y="11" width="22" height="11.5" rx="2.5" fill="#ffffff"/>
  <rect x="7.5" y="15" width="17" height="2.8" rx="0.8" fill="#0f172a"/>

  <!-- Status Indicator LED (Ready) -->
  <circle cx="23.2" cy="13.2" r="1" fill="#10b981"/>

  <!-- Paper Output (Bottom) -->
  <rect x="9" y="15.8" width="14" height="9.8" rx="1.2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
  <rect x="11.5" y="18.5" width="9" height="1.2" rx="0.6" fill="#2563eb"/>
  <rect x="11.5" y="21" width="6.5" height="1" rx="0.5" fill="#94a3b8"/>
  <rect x="11.5" y="23" width="8" height="0.8" rx="0.4" fill="#cbd5e1"/>
</svg>
